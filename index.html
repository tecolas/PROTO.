<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiência Web Interativa</title>
    <style>
        /* ============================
           CSS - DESIGN E ESTILIZAÇÃO
           ============================ */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505; /* Fundo super escuro */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Remove as barras de rolagem */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* O Canvas do fundo animado */
        #background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Fica atrás de tudo */
        }

        /* Container da interface (fica na frente do canvas) */
        .ui-container {
            position: relative;
            z-index: 2;
            perspective: 1000px; /* Habilita a profundidade 3D */
        }

        /* O Cartão de Vidro (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px;
            width: 400px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            /* Transição suave apenas para quando o mouse sair do cartão */
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
            transform-style: preserve-3d;
        }

        /* Elementos dentro do cartão pulam para frente (Efeito 3D) */
        .glass-card > * {
            transform: translateZ(30px);
        }

        .glass-card h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card p {
            font-size: 15px;
            color: #a0aab2;
            font-weight: 300;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: #000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            transform: scale(1.05) translateZ(40px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>

    <!-- O Fundo Animado -->
    <canvas id="background-canvas"></canvas>

    <!-- A Interface Interativa -->
    <div class="ui-container">
        <div class="glass-card" id="tilt-card">
            <h1>Web Interativa</h1>
            <p>Passe o mouse sobre este cartão para ver a física 3D em ação. O fundo reage ao movimento do cursor.</p>
            <button class="btn">Explorar Agora</button>
        </div>
    </div>

    <script>
        /* ============================
           JAVASCRIPT - LÓGICA E INTERAÇÃO
           ============================ */

        // 1. EFEITO 3D NO CARTÃO (TILT)
        const card = document.getElementById('tilt-card');
        
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            // Calcula o centro do cartão
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Aplica a rotação baseada na posição do mouse
            const multiplier = 0.05; // Ajuste a intensidade do efeito aqui
            card.style.transform = `rotateX(${-y * multiplier}deg) rotateY(${x * multiplier}deg)`;
        });

        // Retorna ao centro quando o mouse sai
        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });


        // 2. FUNDO DE PARTÍCULAS INTERATIVAS
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        let mouse = { x: null, y: null, radius: 150 }; // Raio de interação do mouse

        // Ajusta o tamanho do canvas para a tela toda
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        // Captura o movimento do mouse para o canvas
        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Sai da tela, as partículas param de fugir
        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // Classe da Partícula
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = '#4facfe';
                ctx.fill();
            }

            update() {
                // Se bater nas bordas da tela, inverte a direção
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;

                // Colisão com o mouse (Afasta as partículas)
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius + this.size) {
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 3;
                    if (mouse.x > this.x && this.x > this.size * 10) this.x -= 3;
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 3;
                    if (mouse.y > this.y && this.y > this.size * 10) this.y -= 3;
                }

                // Move a partícula
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        // Preenche o array com partículas
        function initParticles() {
            particlesArray = [];
            // Quantidade de partículas baseada no tamanho da tela (para não travar PCs lentos)
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                let color = '#4facfe';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // Desenha as linhas conectando partículas próximas
        function connectParticles() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                                 + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = `rgba(79, 172, 254, ${opacityValue})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Loop de animação contínuo em 60 FPS
        function animateCanvas() {
            requestAnimationFrame(animateCanvas);
            ctx.clearRect(0, 0, innerWidth, innerHeight); // Limpa o frame anterior
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connectParticles();
        }

        initParticles();
        animateCanvas();

    </script>
</body>
</html>
