<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #34495e;
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 10px; }
        p { margin-top: 10px; color: #bdc3c7; }
    </style>
</head>
<body>

    <h1>Jogo da Cobrinha</h1>
    <h2 id="score">Pontuação: 0</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Use as setas do teclado para jogar.</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 20; // Tamanho de cada quadrado
        let snake = [];
        snake[0] = { x: 9 * box, y: 10 * box }; // Posição inicial

        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };

        let score = 0;
        let d; // Direção

        // Escuta as teclas
        document.addEventListener("keydown", direction);

        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") { d = "LEFT"; }
            else if (event.keyCode == 38 && d != "DOWN") { d = "UP"; }
            else if (event.keyCode == 39 && d != "LEFT") { d = "RIGHT"; }
            else if (event.keyCode == 40 && d != "UP") { d = "DOWN"; }
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        function draw() {
            // Limpa o canvas
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha a cobra
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#2ecc71" : "#27ae60";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#2c3e50";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Desenha a comida
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(food.x, food.y, box, box);

            // Posição antiga da cabeça
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Para onde vai
            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            // Se comer a comida
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                document.getElementById("score").innerText = "Pontuação: " + score;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop(); // Remove a cauda se não comeu
            }

            // Nova cabeça
            let newHead = { x: snakeX, y: snakeY };

            // Game Over (bater na parede ou no próprio corpo)
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Sua pontuação foi: " + score + ". Atualize a página para tentar de novo.");
            }

            snake.unshift(newHead);
        }

        // Atualiza o jogo a cada 100ms
        let game = setInterval(draw, 100);
    </script>
</body>
</html>
