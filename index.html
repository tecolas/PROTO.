<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Imperium | Alta Relojoaria</title>
    <style>
        /* ============================
           CSS - DESIGN LUXUOSO
           ============================ */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fundo Azul Meia-Noite */
            background-color: #020b18; 
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Canvas de Engenharia no Fundo */
        #engineering-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Menu de Navegação Minimalista */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px; /* Ajustado sutilmente para o novo nome */
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3); /* Brilho metálico sutil */
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links li a {
            color: #b0c4de;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .nav-links li a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Container Principal 3D */
        .container {
            position: relative;
            z-index: 2;
            perspective: 1200px;
        }

        /* Cartão de Vidro (Glassmorphism Luxo) */
        .luxury-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            padding: 60px 50px;
            width: 450px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
        }

        .luxury-card > * {
            transform: translateZ(40px);
        }

        .luxury-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .luxury-card p {
            font-size: 13px;
            color: #a9bccc;
            letter-spacing: 1px;
            margin-bottom: 40px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        /* ============================
           O RELÓGIO FEITO SÓ COM CSS
           ============================ */
        .clock-container {
            width: 180px;
            height: 180px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin: 0 auto 40px;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05), inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: radial-gradient(circle, #0a192f 0%, #020b18 100%);
            transform: translateZ(60px);
        }

        /* Marcadores de hora */
        .clock-container::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background: #ffffff;
            border-radius: 4px;
            transform: translateX(-50%);
        }

        .hour-hand {
            width: 4px;
            height: 45px;
            background: #ffffff;
            z-index: 5;
        }

        .minute-hand {
            width: 2px;
            height: 65px;
            background: #a9bccc;
            z-index: 6;
        }

        .second-hand {
            width: 1px;
            height: 75px;
            background: #4facfe;
            z-index: 7;
        }

        /* Botão Luxuoso */
        .btn-luxury {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1px solid #ffffff;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-luxury:hover {
            background: #ffffff;
            color: #020b18;
            transform: scale(1.05) translateZ(30px);
            box-shadow: 0 15px 25px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Royal Imperium</div>
        <ul class="nav-links">
            <li><a href="#">Coleções</a></li>
            <li><a href="#">Tradição</a></li>
            <li><a href="#">Boutiques</a></li>
        </ul>
    </nav>

    <!-- Fundo de Geometria/Engenharia -->
    <canvas id="engineering-canvas"></canvas>

    <div class="container">
        <div class="luxury-card" id="tilt-card">
            <h1>Oceana</h1>
            <p>"A precisão do tempo nas profundezas do oceano."</p>
            
            <!-- O Relógio Funcional em CSS -->
            <div class="clock-container">
                <div class="hand hour-hand" id="hour"></div>
                <div class="hand minute-hand" id="minute"></div>
                <div class="hand second-hand" id="second"></div>
            </div>

            <button class="btn-luxury">Explorar Modelo</button>
        </div>
    </div>

    <script>
        /* ============================
           JAVASCRIPT - ALTA PERFORMANCE
           ============================ */

        // 1. LÓGICA DO RELÓGIO EM TEMPO REAL
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondsDegrees = ((seconds / 60) * 360);
            const minutesDegrees = ((minutes / 60) * 360) + ((seconds/60)*6);
            const hoursDegrees = ((hours / 12) * 360) + ((minutes/60)*30);

            secondHand.style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
        }
        setInterval(updateClock, 1000);
        updateClock(); 


        // 2. EFEITO 3D (TILT) SUAVE NO CARTÃO
        const card = document.getElementById('tilt-card');
        
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const multiplier = 0.03; 
            card.style.transform = `rotateX(${-y * multiplier}deg) rotateY(${x * multiplier}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });


        // 3. FUNDO DE ENGENHARIA (Linhas de Precisão)
        const canvas = document.getElementById('engineering-canvas');
        const ctx = canvas.getContext('2d');

        let points = [];
        let mouse = { x: null, y: null };

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            points = [];
            let numberOfPoints = (canvas.width * canvas.height) / 15000;
            for(let i=0; i<numberOfPoints; i++){
                points.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5, 
                    vy: (Math.random() - 0.5) * 0.5
                });
            }
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = undefined; mouse.y = undefined;
        });

        function animateEngineering() {
            requestAnimationFrame(animateEngineering);
            ctx.fillStyle = "rgba(2, 11, 24, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            points.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                ctx.fill();
            });

            for(let i=0; i<points.length; i++) {
                for(let j=i; j<points.length; j++) {
                    let dx = points[i].x - points[j].x;
                    let dy = points[i].y - points[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if(dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(176, 196, 222, ${1 - dist/120})`; 
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(points[j].x, points[j].y);
                        ctx.stroke();
                    }
                }
                
                if(mouse.x != null) {
                    let mdx = points[i].x - mouse.x;
                    let mdy = points[i].y - mouse.y;
                    let mDist = Math.sqrt(mdx*mdx + mdy*mdy);
                    if(mDist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(79, 172, 254, ${1 - mDist/150})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
        }
        animateEngineering();

    </script>
</body>
</html>
